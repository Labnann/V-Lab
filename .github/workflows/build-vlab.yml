name: Build VLab

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman and zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y podman zstd

      - name: Prepare directories
        run: |
          mkdir -p output
          df -h /

      - name: Build VLab image
        run: |
          sudo podman build \
            -t localhost/vlab-builder \
            ./builder

          sudo podman run --rm --privileged \
            -v /dev:/dev \
            -v "$PWD/output:/output:Z" \
            localhost/vlab-builder

      - name: Compress image and generate checksum
        run: |
          IMAGE="vlab-amd64-${GITHUB_REF_NAME}.img.zst"

          zstd -T0 --ultra -22 -f \
            output/vlab-amd64.img \
            -o "output/$IMAGE"

          cd output
          sha256sum "$IMAGE" > SHA256SUMS
          rm vlab-amd64.img

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "output/vlab-amd64-${GITHUB_REF_NAME}.img.zst" \
            output/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Upload temporary build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: vlab-amd64
          path: |
            output/vlab-amd64-*.img.zst
            output/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
